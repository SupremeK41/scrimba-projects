<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <div>
                <h1>HOME</h1>
                <div class = "scorecon"> 
                    <h1 class = "Score" id = "homescore">0</h1>
                </div>
                <div class = "scorebut">
                    <button class = "button" id = "HomeOne" onclick="addscoreHome(1)"> +1 </button>
                    <button class = "button" id = "HomeTwo" onclick="addscoreHome(2)"> +2 </button>
                    <button class = "button" id = "HomeThree" onclick="addscoreHome(3)"> +3 </button>
                </div>
            </div>
            <div class = "resetcol">
                <div class = "scorebut">
                    <button class = "button" id = "reset" onclick= "resetall()"> RESET </button>
                </div>
            </div>
            <div>
                <h1>GUEST</h1>
            <div class = "scorecon"> 
                <h1 class = "Score" id = "guestscore">0</h1>
            </div>
                <div class = "scorebut">
                    <button class = "button" id = "HomeOne" onclick="addscoreGuest(1)"> +1 </button>
                    <button class = "button" id = "HomeTwo" onclick="addscoreGuest(2)"> +2 </button>
                    <button class = "button" id = "HomeThree" onclick="addscoreGuest(3)"> +3 </button>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
